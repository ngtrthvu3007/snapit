# Push tag dạng v1.2.3 → build Mac (universal) + Linux → đưa file cài lên GitHub Releases.
# Ra bản mới: `npm version 1.2.3 && git push --follow-tags`
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # để tạo release và upload file

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: --target universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
          - os: ubuntu-24.04
            args: ""
            rust-targets: ""

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - name: Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev libssl-dev libpipewire-0.3-dev libclang-dev \
            libxcb1-dev libxrandr-dev libdbus-1-dev libgbm-dev

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - run: npm test

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Snapit ${{ github.ref_name }}
          releaseBody: Tải file theo máy bên dưới. Hướng dẫn cài xem README.
          args: ${{ matrix.args }}
